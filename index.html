<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pocket Player</title>
  <meta name="description" content="Lecteur MP3 et MP4 personnel, hors ligne, sans serveur.">
  <meta name="theme-color" content="#0e0f13">
  <meta name="color-scheme" content="dark">

  <!-- Réglages spécifiques à iOS pour l'ajout à l'écran d'accueil -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pocket Player">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- Tous les chemins sont relatifs : le site fonctionne aussi dans un sous-dossier
       comme https://pseudo.github.io/pocket-player/ -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Bibliothèque d'icônes SVG réutilisées partout via <use href="#i-..."> -->
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6.2v11.6a.9.9 0 0 1-1.4.75L9 13.2v4.3a1 1 0 0 1-2 0v-11a1 1 0 0 1 2 0v4.3l7.6-5.35A.9.9 0 0 1 18 6.2z" fill="currentColor"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6.2v11.6a.9.9 0 0 0 1.4.75L15 13.2v4.3a1 1 0 0 0 2 0v-11a1 1 0 0 0-2 0v4.3L7.4 5.45A.9.9 0 0 0 6 6.2z" fill="currentColor"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4"/><path d="M4 19 20 4"/><path d="M20 16v4h-4"/><path d="m15 15 5 5"/><path d="M4 5l5 5"/></g></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="m7 22-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></g></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="m7 22-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/><path d="M11 10h1.5v5"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.6 3.6 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.3 0 5.4 3.1 4.2 6.3C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-9.3-9.2C1.5 7.6 3.6 4.5 6.9 4.5c2 0 3.6 1.1 5.1 3 1.5-1.9 3.1-3 5.1-3 3.3 0 5.4 3.1 4.2 6.3C19.5 15.4 12 20 12 20z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="3"/><path d="m16 10 6-3.5v11L16 14"/></g></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></g></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></g></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h9"/><circle cx="3.5" cy="6" r=".6" fill="currentColor"/><circle cx="3.5" cy="12" r=".6" fill="currentColor"/><circle cx="3.5" cy="18" r=".6" fill="currentColor"/></g></symbol>
  </svg>

  <div id="app">
    <!-- Bandeau affiché quand une nouvelle version de l'application est prête -->
    <div id="update-banner" class="update-banner" hidden>
      <span>Une nouvelle version de Pocket Player est disponible.</span>
      <button type="button" class="btn btn-small btn-accent" data-action="apply-update">Mettre à jour</button>
    </div>

    <!-- Contenu de l'écran courant, généré par app.js -->
    <main id="view" class="view" tabindex="-1">
      <noscript>
        <p class="empty-state">Pocket Player a besoin de JavaScript pour fonctionner.</p>
      </noscript>
      <p class="empty-state">Chargement…</p>
    </main>

    <!-- Mini-lecteur : reste visible pendant la navigation -->
    <div id="mini-player" class="mini-player" hidden>
      <button type="button" class="mini-open" data-action="open-player" aria-label="Ouvrir le lecteur">
        <span class="thumb mini-thumb" id="mini-cover"></span>
        <span class="mini-text">
          <span class="mini-title" id="mini-title">—</span>
          <span class="mini-artist" id="mini-artist"></span>
        </span>
      </button>
      <button type="button" class="icon-btn" data-action="toggle-play" id="mini-play" aria-label="Lecture">
        <svg class="icon"><use href="#i-play"></use></svg>
      </button>
      <button type="button" class="icon-btn" data-action="next-track" aria-label="Morceau suivant">
        <svg class="icon"><use href="#i-next"></use></svg>
      </button>
      <div class="mini-progress"><div class="mini-progress-fill" id="mini-progress"></div></div>
    </div>

    <!-- Barre de navigation principale -->
    <nav class="tabbar" aria-label="Navigation principale">
      <button type="button" class="tab" data-action="navigate" data-view="library" data-tab="library">
        <svg class="icon"><use href="#i-library"></use></svg><span>Bibliothèque</span>
      </button>
      <button type="button" class="tab" data-action="navigate" data-view="music" data-tab="music">
        <svg class="icon"><use href="#i-music"></use></svg><span>Musique</span>
      </button>
      <button type="button" class="tab" data-action="navigate" data-view="videos" data-tab="videos">
        <svg class="icon"><use href="#i-video"></use></svg><span>Vidéos</span>
      </button>
    </nav>
  </div>

  <!-- Lecteur audio détaillé (panneau plein écran) -->
  <section id="player-sheet" class="player-sheet" aria-label="Lecteur audio" aria-hidden="true">
    <div class="player-top">
      <button type="button" class="icon-btn" data-action="close-player" aria-label="Fermer le lecteur">
        <svg class="icon"><use href="#i-chevron-down"></use></svg>
      </button>
      <span class="player-context" id="player-context"></span>
      <button type="button" class="icon-btn" data-action="current-track-menu" aria-label="Options du morceau">
        <svg class="icon"><use href="#i-more"></use></svg>
      </button>
    </div>
    <div class="player-cover" id="player-cover"></div>
    <div class="player-meta">
      <div class="player-meta-text">
        <h2 class="player-title" id="player-title">—</h2>
        <p class="player-artist" id="player-artist"></p>
      </div>
      <button type="button" class="icon-btn" data-action="toggle-favorite-current" id="player-favorite" aria-label="Ajouter aux favoris" aria-pressed="false">
        <svg class="icon"><use href="#i-heart"></use></svg>
      </button>
    </div>
    <div class="player-seek">
      <input type="range" id="seek-bar" class="range" min="0" max="0" step="0.1" value="0" aria-label="Position de lecture">
      <div class="player-times">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button type="button" class="icon-btn toggle-btn" data-action="toggle-shuffle" id="shuffle-btn" aria-label="Lecture aléatoire" aria-pressed="false">
        <svg class="icon"><use href="#i-shuffle"></use></svg>
      </button>
      <button type="button" class="icon-btn icon-btn-large" data-action="previous-track" aria-label="Morceau précédent">
        <svg class="icon"><use href="#i-prev"></use></svg>
      </button>
      <button type="button" class="play-btn" data-action="toggle-play" id="player-play" aria-label="Lecture">
        <svg class="icon"><use href="#i-play"></use></svg>
      </button>
      <button type="button" class="icon-btn icon-btn-large" data-action="next-track" aria-label="Morceau suivant">
        <svg class="icon"><use href="#i-next"></use></svg>
      </button>
      <button type="button" class="icon-btn toggle-btn" data-action="cycle-repeat" id="repeat-btn" aria-label="Répétition désactivée" aria-pressed="false">
        <svg class="icon"><use href="#i-repeat"></use></svg>
      </button>
    </div>
    <p class="player-hint" id="player-hint"></p>
  </section>

  <!-- Lecteur vidéo (écran plein) -->
  <section id="video-screen" class="video-screen" aria-label="Lecteur vidéo" aria-hidden="true">
    <div class="video-top">
      <button type="button" class="icon-btn" data-action="close-video" aria-label="Fermer la vidéo">
        <svg class="icon"><use href="#i-chevron-left"></use></svg>
      </button>
      <h2 class="video-title" id="video-title">—</h2>
      <button type="button" class="icon-btn" data-action="toggle-favorite-video" id="video-favorite" aria-label="Ajouter aux favoris" aria-pressed="false">
        <svg class="icon"><use href="#i-heart"></use></svg>
      </button>
    </div>
    <div class="video-stage">
      <!-- playsinline : la vidéo reste dans la page tant que l'on ne demande pas le plein écran -->
      <video id="video-element" controls playsinline preload="metadata"></video>
    </div>
    <div class="video-error" id="video-error" hidden></div>
    <div class="video-actions">
      <button type="button" class="btn" data-action="video-fullscreen">
        <svg class="icon"><use href="#i-fullscreen"></use></svg>Plein écran
      </button>
    </div>
    <p class="video-info" id="video-info"></p>
  </section>

  <!-- Élément audio unique, réutilisé pour tous les morceaux (important sur iOS) -->
  <audio id="audio-element" preload="auto"></audio>

  <!-- Sélecteurs de fichiers invisibles, ouverts par les boutons « Importer » -->
  <input type="file" id="audio-input" class="visually-hidden" multiple
         accept="audio/*,.mp3,.m4a,.aac,.wav,.aif,.aiff,.caf,.flac" tabindex="-1" aria-hidden="true">
  <input type="file" id="video-input" class="visually-hidden" multiple
         accept="video/mp4,video/quicktime,video/x-m4v,.mp4,.m4v,.mov" tabindex="-1" aria-hidden="true">
  <input type="file" id="backup-input" class="visually-hidden"
         accept="application/json,.json" tabindex="-1" aria-hidden="true">

  <div id="dialog-root" hidden></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
